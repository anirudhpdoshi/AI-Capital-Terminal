<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<title>AI Capital Terminal</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AI Capital Terminal — terminal design system (dark, dense, desktop-first)
   Neutral ground, strong ink. Semantic colour only:
   red = adverse · green = favourable · amber = uncertain/pending · grey = neutral/unavailable
   Every colour cue also carries a glyph or a word.
   ===================================================================== */
:root{
  color-scheme: dark;
  --ground:#0A0E15; --sheet:#10161F; --sheet-2:#151C27; --sheet-3:#1B2431; --sheet-4:#222D3C;
  --rule:#243041; --rule-2:#1A2230;
  --ink:#E8ECF2; --ink-2:#A9B3C3; --ink-3:#7E899B; --ink-4:#5E6879;
  --cobalt:#7F96FF; --cobalt-2:#5D78F5; --cobalt-ink:#0A0E15; --cobalt-tint:rgba(127,150,255,.13);
  --adverse:#F2685E; --adverse-strong:#D9443A; --adverse-tint:rgba(242,104,94,.13);
  --favorable:#3FBF7C; --favorable-tint:rgba(63,191,124,.13);
  --caution:#E7B23F; --caution-tint:rgba(231,178,63,.12);
  --neutral:#8A94A6; --neutral-tint:rgba(138,148,166,.12);
  /* chart series — validated categorical order (dark, on #10161F) */
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#9085e9;
  --rail:216px; --top:52px;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* legacy names read by the dashboard scripts, mapped onto the system */
  --bg:var(--ground); --panel:var(--sheet); --panel2:var(--sheet-2); --muted:var(--ink-3); --line:var(--rule);
  --accent:var(--cat-1); --accent-ink:#fff; --gold:var(--cat-2); --red:var(--adverse); --blue:var(--cobalt); --amber-bg:var(--caution-tint);
  --crit:var(--adverse); --warn-bar:var(--caution);
  --chip-conf:var(--ink); --chip-rep:var(--ink); --chip-ind:var(--caution); --chip-rum:var(--caution); --chip-est:var(--ink-3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.5;font-variation-settings:"wdth" 94;text-rendering:optimizeLegibility}
a{color:var(--cobalt);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
b,strong{font-weight:650;color:var(--ink)}
.mono{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 86}
.num,.tnum{font-variant-numeric:tabular-nums}
svg text{font-family:var(--f-ui);font-variant-numeric:tabular-nums}
button{font-family:inherit}

/* ---------- App shell: rail + top bar + workspace ---------- */
nav{position:fixed;top:0;left:0;bottom:0;width:var(--rail);z-index:60;background:var(--sheet);border-right:1px solid var(--rule);overflow-y:auto}
.nav-in{display:flex;flex-direction:column;padding:12px 10px 20px;gap:1px}
.nav-in .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;margin-bottom:6px;border-bottom:1px solid var(--rule-2);font-weight:750;font-size:14.5px;line-height:1.1;font-variation-settings:"wdth" 80;color:var(--ink)}
.nav-in .brand i{width:26px;height:26px;border-radius:7px;background:var(--cobalt);display:grid;place-items:center;flex:none}
.nav-in .brand i svg{width:16px;height:16px;stroke:var(--cobalt-ink)}
.nav-in .brand small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);font-variation-settings:"wdth" 94;margin-top:3px}
.nav-in a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;color:var(--ink-2);font-size:13.5px;font-weight:540;text-decoration:none;position:relative}
.nav-in a svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav-in a:hover{background:var(--sheet-3);color:var(--ink)}
.nav-in a[aria-current="page"]{background:var(--cobalt-tint);color:var(--ink)}
.nav-in a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--cobalt)}
.nav-in a[aria-current="page"] svg{stroke:var(--cobalt);opacity:1}
.nav-in a .badge{margin-left:auto}
.nav-in .nav-sep{height:1px;background:var(--rule-2);margin:8px 4px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--adverse-tint);color:var(--adverse)}
.badge.n{background:var(--sheet-4);color:var(--ink-2)}

.topbar{position:sticky;top:0;z-index:50;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 112px 0 20px;background:rgba(10,14,21,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.topbar .vt{display:flex;align-items:baseline;gap:10px;min-width:0}
.topbar .vt h1{margin:0;font-size:17px;font-weight:720;font-variation-settings:"wdth" 82;white-space:nowrap}
.topbar .vt span{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.gsearch{position:relative;width:min(380px,36vw)}
.gsearch input{width:100%;height:32px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:8px;color:var(--ink);font-size:13px;padding:0 10px 0 30px}
.gsearch input::placeholder{color:var(--ink-4)}
.gsearch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.gsearch .results{position:absolute;top:38px;left:0;right:0;max-height:60vh;overflow:auto;background:var(--sheet-2);border:1px solid var(--rule);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;display:none}
.gsearch .results.on{display:block}
.gsearch .results button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px}
.gsearch .results button:hover,.gsearch .results button.k{background:var(--sheet-4)}
.gsearch .results small{display:block;color:var(--ink-3);font-size:11.5px}
.gsearch .results p{margin:6px 9px;color:var(--ink-3);font-size:12.5px}
.asof{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.asof .dot{width:7px;height:7px;border-radius:50%;background:var(--caution);box-shadow:0 0 0 3px var(--caution-tint)}

.wrap{margin-left:var(--rail);padding:0 20px 80px;max-width:none}
.view{display:none}
.view.on{display:block}
.view-intro{display:flex;align-items:flex-start;gap:24px;justify-content:space-between;padding:16px 0 4px;color:var(--ink-2);font-size:13px}
.view-intro p{margin:0;max-width:110ch}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:28px;color:var(--ink-2);background:var(--sheet);margin-top:16px;max-width:760px}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:15px}

/* ---------- Sections (compact) ---------- */
section{margin-top:22px;scroll-margin-top:calc(var(--top) + 12px)}
.sec-head{margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sec-head .num{display:none}
.sec-head h2{margin:0;font-size:17px;line-height:1.25;font-weight:700;font-variation-settings:"wdth" 84}
.sec-head p{margin:0;flex-basis:100%;color:var(--ink-2);font-size:12.8px;max-width:150ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sec-head.open p{display:block}
.sec-head .more{background:none;border:none;color:var(--cobalt);font-size:12px;padding:0;cursor:pointer}
.card,.chart-box,.fn-netwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.card h3,.chart-box h3{font-size:14px;line-height:1.3;margin:0 0 6px;font-weight:680}
.card p,.card li{color:var(--ink-2)}
.card .card,.card .chart-box{border:none;padding:0;background:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2 > *,.grid3 > *{min-width:0}
.chart-box,.card{min-width:0;max-width:100%}
.chart-box svg{max-width:100%;height:auto}
ul.tight{margin:2px 0;padding-left:18px} ul.tight li{margin:5px 0}
ul.tight li::marker{color:var(--ink-4)}
.callout{background:var(--caution-tint);border:1px solid rgba(231,178,63,.28);border-left:3px solid var(--caution);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.8px;color:var(--ink-2)}
.callout b:first-child{color:var(--caution);font-size:12px;letter-spacing:.02em}
.chart-box .cap{color:var(--ink-3);font-size:12px;margin:0 0 10px;max-width:130ch}
.src,.kbd-note{font-size:12px;color:var(--ink-3)}
.subsec{margin-top:24px;scroll-margin-top:calc(var(--top) + 12px)}
.subsec h3{font-size:15px;margin:0 0 4px;font-weight:700;font-variation-settings:"wdth" 86}
.subsec .fresh{font-size:12px;color:var(--ink-3);margin:0 0 8px;max-width:150ch}
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px}
.subnav a{font-size:12px;font-weight:560;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);padding:4px 9px;border-radius:6px}
.subnav a:hover{color:var(--ink);border-color:var(--ink-4);text-decoration:none}
details.brief{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;margin-top:12px}
details.brief > summary{cursor:pointer;padding:10px 14px;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px}
details.brief > summary::-webkit-details-marker{display:none}
details.brief > summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
details.brief[open] > summary::before{transform:rotate(90deg)}
details.brief > summary span{color:var(--ink-3);font-weight:500;font-size:12.5px}
details.brief > section{margin:0;padding:0 14px 14px}
details.brief > section .sec-head{display:none}

/* ---------- Evidence grades: shape + word (reported / estimate / guidance distinguishable without colour) ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:620;font-variation-settings:"wdth" 86;line-height:1.2;padding:1px 6px 1px 5px;border-radius:4px;background:var(--sheet-3);color:var(--ink-2);white-space:nowrap;vertical-align:1px;border:none;text-transform:none;letter-spacing:0}
.chip::before{content:"";flex:none;width:8px;height:8px;border:1.4px solid currentColor;border-radius:1.5px;box-sizing:border-box}
.chip[data-grade="confirmed"]{color:var(--ink)} .chip[data-grade="confirmed"]::before{background:currentColor}
.chip[data-grade="reported"]{color:var(--ink)} .chip[data-grade="reported"]::before{background:linear-gradient(135deg,currentColor 50%,transparent 50%)}
.chip[data-grade="indicative"]{color:var(--caution);background:var(--caution-tint)}
.chip[data-grade="rumour"]{color:var(--caution);background:var(--caution-tint)} .chip[data-grade="rumour"]::before{border-style:dashed;border-radius:50%}
.chip[data-grade="estimate"]{color:var(--ink-2)} .chip[data-grade="estimate"]::before{background:repeating-linear-gradient(135deg,currentColor 0 1.1px,transparent 1.1px 2.8px)}
.chip[data-grade="unknown"]{color:var(--ink-3);background:var(--neutral-tint)} .chip[data-grade="unknown"]::before{border-style:dotted;border-radius:50%}
.chip[data-grade="guided"]{color:var(--ink-2)} .chip[data-grade="guided"]::before{transform:rotate(45deg) scale(.85)}
.chip[data-grade="stress"]{color:var(--adverse);background:var(--adverse-tint)} .chip[data-grade="stress"]::before{border:none;width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:8px solid currentColor;border-radius:0}
.chip[data-grade="label"]::before{display:none}

/* ---------- Status: severity, verification, direction ---------- */
.sev{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 6px;border-radius:4px;font-size:11.5px;font-weight:700;white-space:nowrap;font-variation-settings:"wdth" 86;line-height:1.35}
.sev::before{font-size:8.5px;line-height:1}
.sev-crit{background:var(--adverse-strong);color:#fff} .sev-crit::before{content:"▲▲";letter-spacing:-2px;margin-right:2px}
.sev-high{background:var(--adverse-tint);color:var(--adverse)} .sev-high::before{content:"▲"}
.sev-med{background:var(--caution-tint);color:var(--caution)} .sev-med::before{content:"●"}
.sev-watch{background:var(--neutral-tint);color:var(--ink-2)} .sev-watch::before{content:"○"}
.ver{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;white-space:nowrap}
.ver-confirmed{color:var(--favorable)} .ver-confirmed::before{content:"✓"}
.ver-reported{color:var(--ink-2)} .ver-reported::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%);box-sizing:border-box}
.ver-unconfirmed{color:var(--caution)} .ver-unconfirmed::before{content:"?";font-weight:800}
.dn,.delta-neg{color:var(--adverse);font-weight:620} .dn::before,.delta-neg::before{content:"▼ ";font-size:.75em}
.up,.delta-pos{color:var(--favorable);font-weight:620} .up::before,.delta-pos::before{content:"▲ ";font-size:.75em}
.opmode{border:1px solid rgba(242,104,94,.35);border-left:3px solid var(--adverse);background:var(--adverse-tint);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 12px}

/* ---------- Tables (sortable · filterable · pinned first column) ---------- */
.tbl-wrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:auto;max-height:none;position:relative}
.card .tbl-wrap,.chart-box .tbl-wrap{border:none;border-radius:0;background:none}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.6px;line-height:1.42;font-variation-settings:"wdth" 88}
section > table,.subsec > table,.tabpane > table{background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
th{position:sticky;top:0;z-index:3;text-align:left;font-size:11.5px;font-weight:650;color:var(--ink-3);padding:8px 10px;background:var(--sheet-2);border-bottom:1px solid var(--rule);vertical-align:bottom;white-space:normal}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable::after{content:"↕";margin-left:4px;color:var(--ink-4);font-size:10px}
th[aria-sort="ascending"]::after{content:"↑";color:var(--cobalt)}
th[aria-sort="descending"]::after{content:"↓";color:var(--cobalt)}
td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top;color:var(--ink)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{white-space:nowrap;font-variation-settings:"wdth" 84;font-weight:540}
td.num .sub2,td.num .chip{white-space:normal}
td .sub2{display:block;color:var(--ink-3);font-size:11.8px;margin-top:2px;white-space:normal}
.flag{color:var(--ink-2);font-size:12px}
.rank{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.co{font-weight:650;color:var(--ink)}
table.pin tbody td:first-child,table.pin thead th:first-child{position:sticky;left:0;z-index:2;background:var(--sheet)}
table.pin thead th:first-child{z-index:4;background:var(--sheet-2)}
table.pin.pin2 tbody td:nth-child(2),table.pin.pin2 thead th:nth-child(2){position:sticky;left:var(--pin1w,40px);z-index:2;background:var(--sheet);box-shadow:1px 0 0 var(--rule)}
table.pin.pin2 thead th:nth-child(2){z-index:4;background:var(--sheet-2)}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover td{background:var(--sheet-3)}
tbody tr.sel td{background:var(--cobalt-tint)!important}
tbody tr.hit td{animation:hit 1.6s ease-out}
@keyframes hit{from{background:rgba(127,150,255,.35)}to{background:transparent}}
.tbar{display:flex;align-items:center;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.tbar input{height:28px;width:220px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:7px;color:var(--ink);font-size:12.5px;padding:0 9px}
.tbar input::placeholder{color:var(--ink-4)}
.tbar .cnt{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.tbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--rule);background:var(--sheet-2);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink-4)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.btn.pri{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}

/* ---------- Controls ---------- */
.tabs,.fn-filters,.seg{display:inline-flex;gap:2px;flex-wrap:wrap;margin:0 0 10px;padding:2px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:8px}
.tabs button,.fn-filters button,.seg button{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:none;background:transparent;color:var(--ink-3);cursor:pointer}
.tabs button[aria-selected="true"],.fn-filters button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--sheet-4);color:var(--ink)}
.tabs button:hover,.fn-filters button:hover,.seg button:hover{color:var(--ink)}
.tabpane{display:none}.tabpane.on{display:block}
.dl-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dl-row button{font-size:12.5px;font-weight:650;padding:6px 12px;border-radius:7px;border:none;background:var(--cobalt);color:var(--cobalt-ink);cursor:pointer}
.calc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.calc-grid label,.fieldlabel{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:4px}
.calc-grid input,.calc-grid select,select.fn-select,input.fn-input,.sel{width:100%;height:32px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:7px;color:var(--ink);font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums;padding:0 9px}

/* ---------- Bars, legends, timelines ---------- */
.barrow{display:grid;grid-template-columns:200px 1fr 80px;gap:10px;align-items:center;margin:5px 0;font-size:12.5px}
.barrow .track{height:12px;background:var(--sheet-3);border-radius:0 3px 3px 0;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.barrow .val{text-align:right;font-weight:620;font-variant-numeric:tabular-nums}
.barrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c,currentColor);flex:none}
.hm{display:block;height:5px;border-radius:0 2px 2px 0;background:var(--accent);margin-top:4px}
.heat td{text-align:right;font-variant-numeric:tabular-nums}
.heat td:first-child{text-align:left}
.tl{border-left:1px solid var(--rule);margin-left:4px;padding-left:16px}
.tl .ev{position:relative;padding:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--sheet);border:2px solid var(--cobalt)}
.tl .when{font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl .what{font-weight:650}
.shtl{border-left:2px solid var(--rule);padding:1px 0 1px 12px;margin:0 0 8px}
.shtl .when{font-size:12px;font-weight:650;color:var(--ink-3)}

/* ---------- Network & waterfall ---------- */
.fn-legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 0}
.t-reported{box-shadow:inset 3px 0 0 var(--cobalt)} .t-guided{box-shadow:inset 3px 0 0 var(--caution)} .t-estimate{box-shadow:inset 3px 0 0 var(--neutral)} .t-stress{box-shadow:inset 3px 0 0 var(--adverse)}
.fn-netwrap svg{width:100%;height:auto;display:block}
.fn-node{cursor:pointer} .fn-node circle{fill:var(--sheet-3);stroke:var(--ink-2);stroke-width:1.4} .fn-node text{font-size:11px;fill:var(--ink);font-weight:650}
.fn-node.dim,.fn-edge.dim{opacity:.18}
.fn-node.match circle{stroke:var(--cobalt);stroke-width:3}
.fn-edge{cursor:pointer} .fn-edge line{stroke-width:2} .fn-edge text{font-size:9.5px;fill:var(--ink-3)}
.fn-detail{background:var(--sheet-2);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-top:10px;color:var(--ink-2)}
.fn-detail h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.wf-row{display:grid;grid-template-columns:200px 1fr 96px;gap:10px;align-items:center;margin:6px 0;font-size:12.5px}
.wf-row .track{height:14px;background:var(--sheet-3);border-radius:0 3px 3px 0;overflow:hidden;position:relative}
.wf-row .fill{height:100%;border-radius:0 3px 3px 0} .wf-pos{background:var(--favorable)} .wf-neg{background:var(--adverse)} .wf-close{background:var(--cat-1)} .wf-open{background:var(--neutral)}
.wf-row .val{text-align:right;font-weight:620;font-variant-numeric:tabular-nums}
.netsearch{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.netsearch input{height:28px;width:240px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:7px;color:var(--ink);font-size:12.5px;padding:0 9px}

/* ---------- Daily Events workspace ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:9px;padding:9px 12px;text-align:left;color:var(--ink);cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--ink-4)}
.kpi[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.kpi .k{font-size:12px;color:var(--ink-3);font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:24px;line-height:1.15;font-weight:720;font-variation-settings:"wdth" 80;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.adverse .v{color:var(--adverse)} .kpi.caution .v{color:var(--caution)}
.evfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.evfilters .grp{display:flex;align-items:center;gap:6px}
.evfilters .grp > span{font-size:12px;color:var(--ink-3)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.pills button[aria-pressed="true"]{background:var(--cobalt-tint);border-color:var(--cobalt);color:var(--ink)}
.pills button em{font-style:normal;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.evtable td{white-space:nowrap} .evtable td.wrapc{white-space:normal;min-width:240px;max-width:420px}
.evtable .story{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.mini-tl{display:flex;align-items:flex-end;gap:2px;height:auto;min-height:46px;padding:6px 10px;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;margin:0 0 8px;overflow-x:auto}
.mini-tl button{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;color:var(--ink-3);font-size:10.5px;padding:0}
.mini-tl button .b{display:flex;flex-direction:column-reverse;width:14px;gap:1px}
.mini-tl button .b i{display:block;border-radius:1px}
.mini-tl button:hover{color:var(--ink)}
.mini-tl button[aria-pressed="true"]{color:var(--cobalt)}

/* ---------- Evidence / event panel (drawer) ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:90;background:var(--sheet);border-left:1px solid var(--rule);box-shadow:-24px 0 48px rgba(0,0,0,.45);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.panel.on{transform:none}
.panel header{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.panel header .t{flex:1;min-width:0}
.panel header .kicker{font-size:12px;color:var(--ink-3);margin:0 0 3px}
.panel header h2{margin:0;font-size:17px;line-height:1.25;font-weight:720;font-variation-settings:"wdth" 86}
.panel header .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.panel .x{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule);background:var(--sheet-2);color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1}
.panel .body{flex:1;overflow:auto;padding:6px 16px 24px}
.panel h3{font-size:12px;font-weight:700;color:var(--ink-3);margin:16px 0 6px}
.panel ul{margin:0;padding-left:17px} .panel li{margin:4px 0;color:var(--ink)}
.panel dl{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:0;margin:0;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.panel dt,.panel dd{padding:6px 9px;border-bottom:1px solid var(--rule-2);margin:0;font-size:12.5px}
.panel dt{color:var(--ink-3);background:var(--sheet-2)}
.panel dd{color:var(--ink)}
.panel dl > :nth-last-child(-n+2){border-bottom:none}
.panel .srcs a{display:flex;flex-direction:column;padding:7px 9px;border:1px solid var(--rule-2);border-radius:8px;margin-bottom:5px;color:var(--ink)}
.panel .srcs a:hover{border-color:var(--cobalt);text-decoration:none}
.panel .srcs a small{color:var(--ink-3);font-size:11.5px}
.panel .note{font-size:12px;color:var(--ink-3);border-left:2px solid var(--rule);padding-left:9px;margin:10px 0 0}
.panel .hist{border-left:1px solid var(--rule);margin-left:3px;padding-left:12px}
.panel .hist div{position:relative;padding:0 0 8px;font-size:12.5px}
.panel .hist div::before{content:"";position:absolute;left:-16.5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink-3)}
.panel .hist div.cur::before{border-color:var(--cobalt);background:var(--cobalt)}
.panel .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.chart-ev{float:right;margin:-2px 0 4px 8px}

footer{margin-top:40px;border-top:1px solid var(--rule);padding-top:14px;color:var(--ink-3);font-size:12px}

/* ---------- Responsive ---------- */
@media (max-width:1280px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1100px){
  :root{--rail:60px}
  .nav-in a{justify-content:center;padding:9px} .nav-in a span.l,.nav-in a .badge,.nav-in .brand b{display:none}
  .nav-in a .badge.dotb{display:block;position:absolute;top:4px;right:6px;min-width:0;width:8px;height:8px;padding:0}
  .nav-in .brand{justify-content:center;padding:4px 0 12px}
  .grid2,.grid3,.calc-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  :root{--rail:0px;--top:48px}
  nav{top:auto;bottom:0;right:0;width:auto;height:58px;border-right:none;border-top:1px solid var(--rule);overflow-x:auto;overflow-y:hidden}
  .nav-in{flex-direction:row;padding:6px 6px;gap:2px}
  .nav-in .brand,.nav-in .nav-sep{display:none}
  .nav-in a{flex:none;flex-direction:column;gap:2px;padding:5px 10px;font-size:10.5px;min-width:68px}
  .nav-in a span.l{display:block;white-space:nowrap}
  .nav-in a[aria-current="page"]::before{display:none}
  .wrap{padding:0 12px 90px}
  .topbar{padding:0 72px 0 12px;gap:8px}
  .topbar .vt span,.asof{display:none}
  .gsearch{width:auto;flex:1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barrow{grid-template-columns:110px 1fr 66px}
  .wf-row{grid-template-columns:118px 1fr 76px}
  .tbar input{width:100%}
  table.pin.pin2 tbody td:nth-child(2),table.pin.pin2 thead th:nth-child(2){position:static;box-shadow:none}
  .panel{width:100vw}
}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .panel,.scrim{transition:none} tbody tr.hit td{animation:none} }

/* ---------- Focus ---------- */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
tbody tr.rowlink:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}

/* ---------- Lock screen ---------- */
#lockScreen{position:fixed;inset:0;z-index:200;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:20px}
#lockScreen .lock-card{width:100%;max-width:400px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:30px 28px 26px;color:var(--ink)}
#lockScreen .lock-kicker{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:7px}
#lockScreen .lock-kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--caution);box-shadow:0 0 0 3px var(--caution-tint)}
#lockScreen h1{font-size:24px;line-height:1.1;margin:0 0 8px;font-weight:740;font-variation-settings:"wdth" 80}
#lockScreen .lock-sub{color:var(--ink-2);font-size:13.5px;margin:0 0 20px}
#lockScreen label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
#lockScreen input{width:100%;height:40px;background:var(--ground);border:1px solid var(--rule);border-radius:8px;color:var(--ink);font-family:var(--f-ui);font-size:16px;letter-spacing:.08em;padding:0 12px;outline:none}
#lockScreen input:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-tint)}
#lockScreen button{width:100%;height:40px;margin-top:12px;background:var(--cobalt);color:var(--cobalt-ink);border:none;border-radius:8px;font-family:var(--f-ui);font-weight:700;font-size:14px;cursor:pointer}
#lockScreen button:hover{background:#97A9FF}
#lockScreen button:disabled{opacity:.7;cursor:progress}
#lockErr{display:none;color:var(--adverse);font-size:13px;margin:10px 0 0}
#lockBtn{display:none;position:fixed;top:11px;right:14px;z-index:70;height:30px;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);border-radius:7px;font-family:var(--f-ui);font-size:12.5px;font-weight:650;padding:0 11px;cursor:pointer}
#lockBtn:hover{color:var(--ink);border-color:var(--ink-4)}
#lockScreen input:focus-visible,#lockScreen button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
@media (max-width:760px){ #lockBtn{top:9px;right:10px} }
@media print{
  nav,#lockBtn,.topbar,.panel,.scrim,.tbar{display:none !important}
  .wrap{margin:0} .view{display:block!important}
  th{position:static}
}
</style>

</div>

var KEY_FLAG = 'aiCapitalTerminalKey';
function b64d(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function b64e(u){ var s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
function deriveKey(pass){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){ return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, true, ['decrypt']); });
}
function gunzip(buf){
  var ds = new DecompressionStream('gzip');
  return new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
}
function decryptWith(key){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct))
    .then(gunzip).then(JSON.parse);
}
function render(app, key){
  document.getElementById('appHolder').innerHTML = app.html;
  var s = document.createElement('script');
  s.textContent = app.js + '\ninitDashboard();';
  document.body.appendChild(s);
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('lockBtn').style.display = 'block';
  if (location.hash) { var t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
  return crypto.subtle.exportKey('raw', key).then(function(raw){
    try { sessionStorage.setItem(KEY_FLAG, b64e(new Uint8Array(raw))); } catch(e){}
  });
}
function fail(msg){
  var err=document.getElementById('lockErr'), inp=document.getElementById('lockInput'), go=document.getElementById('lockGo');
  err.textContent=msg; err.style.display='block'; go.disabled=false; go.textContent='Unlock';
  inp.value=''; inp.focus();
}
var supported = !!(window.crypto && crypto.subtle && window.DecompressionStream);
document.getElementById('lockForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  if (!supported) { fail('This browser cannot decrypt the terminal. Use a current Chrome, Edge, Safari or Firefox.'); return; }
  var go=document.getElementById('lockGo'); go.disabled=true; go.textContent='Decrypting…';
  document.getElementById('lockErr').style.display='none';
  var pass=document.getElementById('lockInput').value, k;
  deriveKey(pass).then(function(key){ k=key; return decryptWith(key); })
    .then(function(app){ return render(app, k); })
    .catch(function(){ fail('Incorrect passcode'); });
});
document.getElementById('lockBtn').addEventListener('click', function(){
  try { sessionStorage.removeItem(KEY_FLAG); } catch(e){}
  window.location.reload();
});
try {
  var saved = sessionStorage.getItem(KEY_FLAG);
  if (saved && supported) {
    crypto.subtle.importKey('raw', b64d(saved), {name:'AES-GCM'}, true, ['decrypt'])
      .then(function(key){ return decryptWith(key).then(function(app){ return render(app, key); }); })
      .catch(function(){ try { sessionStorage.removeItem(KEY_FLAG); } catch(e){} });
  }
} catch(e){}
})();
